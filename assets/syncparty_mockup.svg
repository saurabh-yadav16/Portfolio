<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.03)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bg-grad)"/>
  <circle cx="200" cy="150" r="300" fill="#8b5cf6" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="600" r="250" fill="#06b6d4" opacity="0.08" filter="blur(60px)"/>

  <!-- App Main Frame / Window -->
  <g filter="url(#shadow)" transform="translate(60, 50)">
    <!-- Window Outer Shell -->
    <rect width="1080" height="650" rx="16" fill="#121520" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Top Window Title Bar -->
    <rect width="1080" height="48" rx="16" fill="#181b2a"/>
    <rect y="36" width="1080" height="12" fill="#181b2a"/>
    <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="24" r="6" fill="#27c93f"/>
    <text x="540" y="29" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SyncParty • Room #4092 (Live Watch Party)</text>
    
    <!-- Status Badge -->
    <rect x="940" y="14" width="110" height="22" rx="11" fill="rgba(39, 201, 63, 0.15)"/>
    <circle cx="954" cy="25" r="4" fill="#27c93f"/>
    <text x="965" y="29" fill="#27c93f" font-family="system-ui, sans-serif" font-size="11" font-weight="700">12 ONLINE</text>

    <!-- Main Content Layout -->
    <!-- Video Player Container (Left 70%) -->
    <rect x="24" y="72" width="720" height="430" rx="12" fill="#090b10" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Simulated Video Frame (YouTube Synchronized Player) -->
    <rect x="24" y="72" width="720" height="430" rx="12" fill="url(#card-glow)"/>
    
    <!-- Play Icon & Waveform -->
    <circle cx="384" cy="260" r="40" fill="url(#purple-cyan)" opacity="0.9"/>
    <polygon points="376,245 400,260 376,275" fill="#ffffff"/>
    
    <!-- Video Title Bar Overlay -->
    <rect x="40" y="88" width="400" height="32" rx="6" fill="rgba(0,0,0,0.6)"/>
    <text x="54" y="109" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600">▶ Tech Talk 2026 - Scalable Realtime Architectures</text>

    <!-- Video Controls Bar -->
    <rect x="24" y="454" width="720" height="48" rx="0" fill="rgba(15, 18, 28, 0.9)"/>
    <!-- Progress Bar -->
    <rect x="40" y="462" width="688" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="40" y="462" width="420" height="4" rx="2" fill="url(#purple-cyan)"/>
    <circle cx="460" cy="464" r="6" fill="#ffffff"/>
    
    <text x="40" y="488" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">14:32 / 38:05</text>
    <text x="640" y="488" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SYNC: 12ms</text>

    <!-- Lower Controls / Room Info (Left Bottom 30%) -->
    <rect x="24" y="518" width="720" height="106" rx="12" fill="#181b2a" stroke="rgba(255,255,255,0.06)"/>
    <text x="44" y="548" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Room Participants & Host Controls</text>
    <text x="44" y="570" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13">Host: Saurabh Yadav • Role-Based Access Control Enabled (RBAC)</text>
    
    <!-- User Avatars -->
    <g transform="translate(44, 584)">
      <circle cx="16" cy="16" r="16" fill="#8b5cf6"/><text x="16" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">SY</text>
      <circle cx="44" cy="16" r="16" fill="#06b6d4"/><text x="44" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">AK</text>
      <circle cx="72" cy="16" r="16" fill="#ec4899"/><text x="72" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PR</text>
      <circle cx="100" cy="16" r="16" fill="#f59e0b"/><text x="100" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">RO</text>
      <circle cx="128" cy="16" r="16" fill="#3b82f6"/><text x="128" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">+8</text>
    </g>

    <!-- Right Sidebar (Real-Time Socket.io Chat Panel) -->
    <rect x="760" y="72" width="296" height="552" rx="12" fill="#181b2a" stroke="rgba(255,255,255,0.06)"/>
    <rect x="760" y="72" width="296" height="52" rx="12" fill="rgba(255,255,255,0.03)"/>
    <text x="780" y="104" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">💬 Socket.IO Live Chat</text>

    <!-- Chat Messages -->
    <!-- Message 1 -->
    <g transform="translate(776, 140)">
      <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Saurabh (Host)</text>
      <rect x="0" y="8" width="230" height="36" rx="8" fill="rgba(139, 92, 246, 0.15)"/>
      <text x="10" y="31" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Welcome everyone! Video synced.</text>
    </g>

    <!-- Message 2 -->
    <g transform="translate(776, 210)">
      <text x="0" y="0" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ananya</text>
      <rect x="0" y="8" width="240" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="10" y="31" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">The latency is super smooth! 🔥</text>
    </g>

    <!-- Message 3 -->
    <g transform="translate(776, 280)">
      <text x="0" y="0" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Rohan</text>
      <rect x="0" y="8" width="210" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="10" y="31" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Can you pause at 15:00?</text>
    </g>

    <!-- Message 4 -->
    <g transform="translate(776, 350)">
      <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Saurabh (Host)</text>
      <rect x="0" y="8" width="240" height="36" rx="8" fill="rgba(139, 92, 246, 0.15)"/>
      <text x="10" y="31" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Sure thing, pausing now!</text>
    </g>

    <!-- Chat Input Box -->
    <rect x="776" y="566" width="264" height="42" rx="8" fill="#0d0f17" stroke="rgba(255,255,255,0.1)"/>
    <text x="792" y="592" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">Type a message...</text>
    <circle cx="1020" cy="587" r="14" fill="url(#purple-cyan)"/>
    <polygon points="1016,587 1022,582 1022,592" fill="#ffffff"/>
  </g>
</svg>
